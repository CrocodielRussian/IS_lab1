name: Build and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and integration tests
        run: ./mvnw -B -ntp clean verify
      - name: SAST - SpotBugs with Find Security Bugs
        if: ${{ !cancelled() }}
        run: ./mvnw -B -ntp compile spotbugs:check
      - name: Upload tests and SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-sast
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: SCA - OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp dependency-check:check
      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
